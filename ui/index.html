<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AudioHub 汇聚端</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>AudioHub <span>连接设备</span></h1>
      <div class="sub">多台设备的声音，汇到这一副耳机里</div>
    </div>
    <div class="hdr-right">
      <div class="addr">
        <div>
          <div class="k">手机上填</div>
          <div class="v" id="addr">—</div>
        </div>
        <button id="copyBtn">复制</button>
      </div>
      <!-- 破坏性操作只放在头部右侧（不占控制屏的一整行）；只在控制界面出现 -->
      <button id="leaveBtn" class="leavebtn" style="display:none"
              title="断开所有连接，回到连接界面">全部断开</button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <!-- ============ 连接界面 ============ -->
  <div id="screenConnect">
    <div class="sect" id="sectReq" style="display:none">连接请求</div>
    <div class="grid" id="reqGrid"></div>

    <div class="sectrow">
      <div class="sect" id="sectPeer" style="margin:0">发现的设备</div>
      <button class="scanbtn" id="scanBtn">扫描</button>
    </div>
    <div class="hint" id="scanHint"></div>
    <div class="grid" id="peerGrid"></div>

    <div class="sectrow">
      <div class="sect" style="margin:0">按 IP 直接邀请</div>
    </div>
    <div class="hint">广播被拦的网络（办公 / 校园 WiFi 常见）用这个。填手机上的地址，端口默认 47000</div>
    <div class="grid">
      <div class="card" style="max-width:560px">
        <div class="row">
          <input class="ipinput" id="manualIp" placeholder="例如 10.135.7.56:47000">
          <button class="btn go" id="manualInviteBtn">邀请</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ============ 控制界面：全网图谱 ============ -->
  <div id="screenControl" style="display:none">
    <!-- 3D 图谱：Canvas 2D 手写透视投影（ui/scene3d.js）。
         画布撑满 .graphwrap（逻辑视口恒 920x460，按容器等比缩放并居中，见 scene3d.fitInfo），
         hub 投影仍是 (460,208)；role/aria 保留，读屏体验不倒退。 -->
    <div class="graphwrap">
      <canvas id="graph" width="920" height="460" role="img" aria-label="全网设备图谱（3D）"></canvas>
    </div>

    <!-- 切换后的同步状态：已切换，正在同步… / 已同步（vN） -->
    <div id="graphStatus" class="graphstatus" style="display:none"></div>

    <!-- 节点右键菜单（左键只拖动；切换汇聚端 / 音量与静音 / 位置复位都在这里）。
         内容由 renderer.js 动态生成，位置 fixed 跟随鼠标并夹在视口内。 -->
    <div id="ctxMenu" class="ctxmenu" style="display:none"></div>

    <div id="volumePanel" class="volpanel" style="display:none">
      <div class="volname" id="volName">—</div>
      <div class="row">
        <input type="range" id="volSlider" min="0" max="150" value="100">
        <span class="pct" id="volPct">100%</span>
        <button class="mute" id="volMute">静音</button>
      </div>
    </div>
    <!-- 会话进行中也可能有新设备接入 -->
    <div id="ctrlReq"></div>

    <div class="sectrow">
      <div class="sect" style="margin:0">新设备</div>
      <button class="scanbtn" id="ctrlAddBtn">添加设备</button>
    </div>
    <div id="ctrlAddPanel" style="display:none">
      <div class="hint">扫描附近，或直接填对端地址。会话不会中断。</div>
      <div class="grid" id="ctrlPeers"></div>
      <div class="grid">
        <div class="card" style="max-width:560px">
          <div class="row">
            <input class="ipinput" id="ctrlIp" placeholder="例如 10.135.7.56:47000">
            <button class="btn go" id="ctrlInviteBtn">邀请</button>
          </div>
        </div>
      </div>
    </div>

    <div class="hubbar">
      <span class="hublabel">汇聚端</span>
      <span class="hubnow" id="hubNow">—</span>
      <span class="hubnote" id="hubNote">承担收流 / 混音 / 播放</span>
      <label class="autochk">
        <input type="checkbox" id="autoAccept">
        <span>自动同意连接请求</span>
      </label>
    </div>
  </div>

  <div id="stats" class="stats"></div>
</div>

<script src="scene3d.js"></script>
<script src="renderer.js"></script>
</body>
</html>
